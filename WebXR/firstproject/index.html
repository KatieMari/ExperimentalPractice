<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple WebXR</title>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-event-set-component@5.0.0/dist/aframe-event-set-component.min.js"></script>
    <script>
        AFRAME.registerComponent('toggle-colour', {
            schema: {
                colour: { type: 'color', default: 'purple' }

            },
            init: function () {
                // get reference to the a-frame entity to which this component is attached
                const el = this.el;
                // get a reference to data
                const data = this.data;
                // store a reference to the current colour
                const defaultColour = el.getAttribute('material').color;
                el.addEventListener('mouseenter', function () {
                    el.setAttribute('color', data.colour);
                })
                el.addEventListener('mouseleave', function () {
                    el.setAttribute('color', defaultColour);
                })
                
                el.addEventListener('click', function () {
                    // a toggle. stops if it's playing, starts if its not
                    // checks the sounds component's isPlaying
                    if (el.components.sound.isPlaying) {
                        el.components.sound.stopSound();
                    } else {
                        el.components.sound.playSound();
                    }   
                })

            }
        })

        AFRAME.registerComponent('sound-react', {
            schema: {
                strength: { type: 'number', default: '1'}
            },
            tick: function () {
                const sound = this.el.components.sound;
                //  this.analyser stores the analyser on the component, so its only created once rather than 72 times per second
                if (!this.analyser) {
                    //  return leaves tick early for this frame, A-Frame tries again on the next one
                    if (!sound || sound.pool.children.length === 0) return;
                    // THREE is the 3D library underneath A-Frame
                    // 32 is the analysers detail level called fftSize
                    this.analyser = new THREE.AudioAnalyser(sound.pool.children[0], 256);
                }

                const level = this.analyser.getAverageFrequency();
                const size = 1 + (level /  255) * this.data.strength;
                console.log(level);

                // this.el.object3D.scale.set(size, size, size);

                // test
                if (this.current === undefined) this.current = 1;
                this.current += (size - this.current) * 0.2;
                this.el.object3D.scale.set(this.current, this.current, this.current);
                

            }
        })
    </script>
</head>

<body>
    <a-scene>
        <a-assets>
            <audio id="box-sound" src="sounds/box.mp3" preload="auto"></audio>
            <audio id="sphere-sound" src="sounds/sphere.mp3" preload="auto"></audio>
            <audio id="cylinder-sound" src="sounds/cylinder.wav" preload="auto"></audio>
        </a-assets>
        <a-camera>
            <a-entity cursor="rayOrigin: mouse" raycaster="objects: .interactive"></a-entity>
        </a-camera>

        <a-entity laser-controls="hand: left" raycaster="objects: .interactive"></a-entity>
        <a-entity laser-controls="hand: right" raycaster="objects: .interactive"></a-entity>

        <a-box sound="src: #box-sound; loop:true; refDistance: 2.5" sound-react="strength: 3" toggle-colour="colour: powderBlue" class="interactive" position="-1 0.5 -3" rotation="0 45 0"
            color="pink"></a-box>
        <a-sphere sound="src: #sphere-sound; loop:true; rolloffFactor: 2" sound-react="strength: 1" toggle-colour="colour: steelBlue" class="interactive" position="0 1.25 -5" radius="1.25"
            color="lavenderBlush"></a-sphere>
        <a-cylinder sound="src: #cylinder-sound; loop:true; distanceModel: linear; maxDistance: 5" sound-react="strength: 1.5" toggle-colour="colour: aliceBlue" class="interactive" position="1 0.75 -3" radius="0.5" height="1.5"
            color="paleVioletRed"></a-cylinder>

        <a-plane position="0 0 -4" rotation="-90 0 0" width="4" height="4" color="thistle"></a-plane>
        <a-sky color="rosyBrown"></a-sky>
    </a-scene>

</body>

</html>
